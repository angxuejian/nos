name: Publish Nos Cli

on:
  push:
    tags:
      - "cli-v*"

jobs:

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 必须获取完整 git 历史，否则无法判断分支

      - name: Check tag branch
        run: |
          if ! git branch -r --contains $GITHUB_SHA | grep "origin/main"; then
            echo "❌ Tag is not from main branch"
            exit 1
          fi

          echo "✅ Tag is from main branch"

      - name: Test publish
        run: |
          echo "success"