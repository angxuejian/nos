name: Publish Nos Cli

on:
  push:
    branches:
      - main

jobs:

  ci:
    uses: ./.github/workflows/ci.yml


  check-cli-change:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.cli }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check apps/cli changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cli:
              - 'apps/cli/**'


  publish:
    needs: check-cli-change
    if: needs.check-cli-change.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Publish cli
        run: |
          echo "publish cli"